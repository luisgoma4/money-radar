<style>
  :root {

    --bg:            #f7f7f5;
    --panel:         #ffffff;
    --panel-border:  #e2e1db;
    --text-primary:  #14161c;
    --text-secondary:#5b5e6b;
    --text-muted:    #8b8e99;
    --accent:        #1f7a72;
    --accent-soft:   #e4f2f0;
    --edge-hi:       #1f7a72;
    --ring:          #14161c;
    --scrollbar:     #d8d7d0;

    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #b5860a;

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1115; --panel: #171a20; --panel-border: #2a2e37;
      --text-primary: #f1f2f4; --text-secondary: #a6aab5; --text-muted: #6d717d;
      --accent: #4fd1c1; --accent-soft: #163430; --edge-hi: #4fd1c1;
      --ring: #f1f2f4; --scrollbar: #2a2e37; --shadow: 0 8px 28px rgba(0,0,0,0.45);
      --c1: #3987e5; --c2: #f07d47; --c3: #22c98d; --c4: #d9a520;
      --c5: #f193b6; --c6: #8f7fe0; --c7: #e5716f; --c8: #9499a8;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1115; --panel: #171a20; --panel-border: #2a2e37;
    --text-primary: #f1f2f4; --text-secondary: #a6aab5; --text-muted: #6d717d;
    --accent: #4fd1c1; --accent-soft: #163430; --edge-hi: #4fd1c1;
    --ring: #f1f2f4; --scrollbar: #2a2e37; --shadow: 0 8px 28px rgba(0,0,0,0.45);
    --c1: #3987e5; --c2: #f07d47; --c3: #22c98d; --c4: #d9a520;
    --c5: #f193b6; --c6: #8f7fe0; --c7: #e5716f; --c8: #9499a8;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text-primary);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

  #stage { position: fixed; inset: 0; display: block; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }

  .panel {
    position: fixed;
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    box-shadow: var(--shadow);
  }

  #rail { top: 16px; left: 16px; width: 268px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 32px); }
  #title { font-size: 13px; font-weight: 650; letter-spacing: 0.02em; display: flex; align-items: baseline; justify-content: space-between; }
  #title span.sub { font-size: 10.5px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }

  #search { width: 100%; padding: 7px 10px; border-radius: 7px; border: 1px solid var(--panel-border); background: var(--bg); color: var(--text-primary); font-size: 12.5px; outline: none; }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #search-count { font-size: 10.5px; color: var(--text-muted); margin-top: -6px; min-height: 12px; }

  .label { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 2px; }

  #legend { display: flex; flex-direction: column; gap: 3px; overflow-y: auto; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 5px 7px; border-radius: 7px; cursor: pointer; font-size: 12px; user-select: none; border: 1px solid transparent; }
  .chip:hover { background: var(--accent-soft); }
  .chip.off { opacity: 0.38; }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .chip .name { flex: 1; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .count { color: var(--text-muted); font-size: 11px; }

  #stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  #stats .stat-value { font-size: 15px; font-weight: 650; }
  #stats .stat-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }

  #display-controls { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--panel-border); }
  .slider-row { display: flex; align-items: center; gap: 8px; }
  .slider-row .slider-label { font-size: 11.5px; color: var(--text-secondary); flex: 0 0 66px; }
  .slider-row output { font-size: 10.5px; color: var(--text-muted); flex: 0 0 26px; text-align: right; }
  .slider-row input[type="range"] { flex: 1; -webkit-appearance: none; appearance: none; height: 3px; border-radius: 2px; background: var(--panel-border); outline: none; margin: 0; }
  .slider-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--panel-border); }
  .slider-row input[type="range"]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--panel-border); }

  #hint { position: fixed; top: 16px; right: 16px; padding: 8px 12px; font-size: 11px; color: var(--text-muted); display: flex; gap: 14px; }
  #hint kbd { font-family: inherit; background: var(--accent-soft); color: var(--accent); padding: 1px 5px; border-radius: 4px; font-size: 10.5px; font-weight: 650; }

  #inspector { top: 16px; right: 16px; width: 300px; padding: 16px; display: none; flex-direction: column; gap: 10px; max-height: calc(100vh - 32px); overflow-y: auto; }
  #inspector.open { display: flex; }
  #inspector .close { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 6px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 15px; line-height: 1; }
  #inspector .close:hover { background: var(--accent-soft); color: var(--accent); }
  #ins-proj { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 650; }
  #ins-label { font-size: 16px; font-weight: 650; text-wrap: balance; }
  #ins-file { font-size: 11.5px; color: var(--text-secondary); word-break: break-all; }
  #ins-community { font-size: 11.5px; color: var(--text-secondary); }
  #ins-deg { font-size: 11px; color: var(--text-muted); }
  #ins-neighbors { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .nb-item { font-size: 11.5px; padding: 5px 7px; border-radius: 6px; cursor: pointer; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
  .nb-item:hover { background: var(--accent-soft); }
  .nb-item .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .nb-item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #tooltip { position: fixed; pointer-events: none; z-index: 50; padding: 6px 9px; border-radius: 7px; background: var(--panel); border: 1px solid var(--panel-border); box-shadow: var(--shadow); font-size: 11.5px; display: none; max-width: 260px; }
  #tooltip .t-label { font-weight: 650; }
  #tooltip .t-file { color: var(--text-muted); font-size: 10.5px; margin-top: 1px; }

  #legend::-webkit-scrollbar, #inspector::-webkit-scrollbar { width: 6px; }
  #legend::-webkit-scrollbar-thumb, #inspector::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
</style>

<script>
(function () {
  "use strict";

  var raw = JSON.parse(document.getElementById("graph-data").textContent);
  var nodes = raw.nodes;
  var links = raw.links;

  var rootStyle = getComputedStyle(document.documentElement);
  function cssVar(name) { return rootStyle.getPropertyValue(name).trim(); }

  // ---- derive up to 8 groups from the data itself (frequency-ranked, "Other" last) ----
  var projCounts = {};
  nodes.forEach(function (n) { n.proj = n.proj || "Other"; projCounts[n.proj] = (projCounts[n.proj] || 0) + 1; });
  var projList = Object.keys(projCounts).sort(function (a, b) { return projCounts[b] - projCounts[a]; });
  if (projList.length > 8) {
    var keep = {};
    projList.slice(0, 7).forEach(function (p) { keep[p] = true; });
    nodes.forEach(function (n) { if (!keep[n.proj]) n.proj = "Other"; });
    projCounts = {};
    nodes.forEach(function (n) { projCounts[n.proj] = (projCounts[n.proj] || 0) + 1; });
    projList = Object.keys(projCounts).sort(function (a, b) { return projCounts[b] - projCounts[a]; });
  }
  var colorSlots = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6", "--c7", "--c8"];
  var projColor = {}, projVisible = {};
  var pinned = {"Cloudy": "--c1", "SEMF": "--c2", "Causality Graphs": "--c3", "BranchOut": "--c4", "Fundacion Delfina Leon": "--c5", "CosmoVentures": "--c6", "Hitos": "--c8"}; projList.forEach(function (p, i) { projColor[p] = cssVar(pinned[p] || colorSlots[i % 8]); projVisible[p] = true; });

  var byId = {};
  nodes.forEach(function (n) { byId[n.id] = n; n.deg = n.deg || 0; });

  var nodeSizeMult = 1, edgeWidthMult = 1;
  var nodeSizeInput = document.getElementById("node-size");
  var edgeWidthInput = document.getElementById("edge-width");
  var nodeSizeVal = document.getElementById("node-size-val");
  var edgeWidthVal = document.getElementById("edge-width-val");
  nodeSizeInput.addEventListener("input", function () {
    nodeSizeMult = parseFloat(nodeSizeInput.value);
    nodeSizeVal.textContent = nodeSizeMult.toFixed(2) + "×";
  });
  edgeWidthInput.addEventListener("input", function () {
    edgeWidthMult = parseFloat(edgeWidthInput.value);
    edgeWidthVal.textContent = edgeWidthMult.toFixed(2) + "×";
  });

  var neighborMap = {};
  nodes.forEach(function (n) { neighborMap[n.id] = []; });
  links.forEach(function (l) {
    if (neighborMap[l.s]) neighborMap[l.s].push(l.t);
    if (neighborMap[l.t]) neighborMap[l.t].push(l.s);
  });

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");
  var W, H, DPR;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  var yaw = 0.6, pitch = -0.3, dist = 340, focal = 620;
  var targetDist = dist;
  var autoSpin = true;

  var dragging = false, lastX = 0, lastY = 0, dragMoved = false;
  canvas.addEventListener("pointerdown", function (e) {
    dragging = true; dragMoved = false; lastX = e.clientX; lastY = e.clientY; autoSpin = false;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!dragging) { handleHover(e); return; }
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (Math.abs(dx) + Math.abs(dy) > 2) dragMoved = true;
    yaw += dx * 0.006;
    pitch += dy * 0.006;
    pitch = Math.max(-1.4, Math.min(1.4, pitch));
    lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener("pointerup", function (e) {
    if (dragging && !dragMoved) handleClick(e);
    dragging = false;
  });
  canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    targetDist *= Math.pow(1.0012, e.deltaY);
    targetDist = Math.max(60, Math.min(1400, targetDist));
  }, { passive: false });

  var cosY, sinY, cosP, sinP;
  function updateRotation() {
    cosY = Math.cos(yaw); sinY = Math.sin(yaw);

  }
  function project(n) {
    var x = n.x, y = n.y, z = n.z;
    var x1 = x * cosY - z * sinY;

  }

    if (searchMatches) return !searchMatches.has(n.id);

    dist += (targetDist - dist) * 0.14;

    for (var i = 0; i < nodes.length; i++) {

    for (var k = 0; k < order.length; k++) {
      var nd = order[k];
      var p = projected[nd.id];
      if (!p) continue;
      var dimmed = isDimmed(nd);
      var r = nodeRadius(nd, p);
      ctx.globalAlpha = dimmed ? 0.10 : Math.max(0.55, Math.min(1, p.scale / 1.9));
      ctx.fillStyle = projColor[nd.proj] || "#888";
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
      ctx.fill();

      if (selected && nd.id === selected.id) {
        ctx.globalAlpha = 1;
        ctx.strokeStyle = ringColor;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(p.sx, p.sy, r + 4, 0, Math.PI * 2);
        ctx.stroke();
      }
      if (hovered && nd.id === hovered.id && nd.id !== (selected && selected.id)) {
        ctx.globalAlpha = 0.9;
        ctx.strokeStyle = ringColor;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(p.sx, p.sy, r + 3, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(render);
  }

  function pickAt(clientX, clientY) {
    var best = null, bestD = 14 * 14;
    for (var id in projected) {
      var p = projected[id];
      var n = byId[id];
      if (!n || !nodeVisible(n)) continue;
      var dx = p.sx - clientX, dy = p.sy - clientY;
      var d2 = dx * dx + dy * dy;
      var r = nodeRadius(n, p);
      var thresh = Math.max(10, r + 6);
      if (d2 < thresh * thresh && d2 < bestD) { bestD = d2; best = n; }
    }
    return best;
  }

  var tooltip = document.getElementById("tooltip");
  function handleHover(e) {
    var n = pickAt(e.clientX, e.clientY);
    hovered = n;
    if (n) {
      tooltip.style.display = "block";
      tooltip.style.left = (e.clientX + 14) + "px";
      tooltip.style.top = (e.clientY + 14) + "px";
      tooltip.innerHTML =
        '<div class="t-label mono">' + escapeHtml(n.label) + '</div>' +
        '<div class="t-file">' + escapeHtml(n.proj) + ' · ' + escapeHtml(n.sf) + (n.loc ? (':' + n.loc) : '') + '</div>';
    } else {
      tooltip.style.display = "none";
    }
  }
  canvas.addEventListener("pointerleave", function () { tooltip.style.display = "none"; hovered = null; });

  function handleClick(e) {
    var n = pickAt(e.clientX, e.clientY);
    if (n) selectNode(n); else deselect();
  }

  var inspector = document.getElementById("inspector");
  var insProj = document.getElementById("ins-proj");
  var insLabel = document.getElementById("ins-label");
  var insFile = document.getElementById("ins-file");
  var insCommunity = document.getElementById("ins-community");
  var insDeg = document.getElementById("ins-deg");
  var insNeighbors = document.getElementById("ins-neighbors");

  function selectNode(n) {
    selected = n;
    searchMatches = null;
    document.getElementById("search").value = "";
    document.getElementById("search-count").textContent = "";
    inspector.classList.add("open");
    insProj.textContent = n.proj;
    insProj.style.color = projColor[n.proj];
    insLabel.textContent = n.label;
    insFile.textContent = n.sf + (n.loc ? (":" + n.loc) : "");
    insCommunity.textContent = n.community || "—";
    insDeg.textContent = n.deg + " connection" + (n.deg === 1 ? "" : "s");
    insNeighbors.innerHTML = "";
    var nbs = (neighborMap[n.id] || []).slice(0, 40);
    nbs.forEach(function (nid) {
      var nb = byId[nid];
      if (!nb) return;
      var div = document.createElement("div");
      div.className = "nb-item";
      var dot = document.createElement("div");
      dot.className = "dot";
      dot.style.background = projColor[nb.proj] || "#888";
      var t = document.createElement("div");
      t.className = "t mono";
      t.textContent = nb.label;
      div.appendChild(dot); div.appendChild(t);
      div.addEventListener("click", function () { selectNode(nb); });
      insNeighbors.appendChild(div);
    });
  }
  function deselect() { selected = null; inspector.classList.remove("open"); }
  document.getElementById("ins-close").addEventListener("click", deselect);

  var legendEl = document.getElementById("legend");
  projList.forEach(function (p) {
    var chip = document.createElement("div");
    chip.className = "chip";
    chip.innerHTML =
      '<div class="dot" style="background:' + projColor[p] + '"></div>' +
      '<div class="name">' + escapeHtml(p) + '</div>' +
      '<div class="count mono">' + projCounts[p] + '</div>';
    chip.addEventListener("click", function () {
      projVisible[p] = !projVisible[p];
      chip.classList.toggle("off", !projVisible[p]);
    });
    legendEl.appendChild(chip);
  });

  var searchInput = document.getElementById("search");
  var searchCount = document.getElementById("search-count");
  searchInput.addEventListener("input", function () {
    var q = searchInput.value.trim().toLowerCase();
    if (!q) { searchMatches = null; searchCount.textContent = ""; return; }
    var set = new Set();
    nodes.forEach(function (n) {
      if (n.label.toLowerCase().indexOf(q) !== -1 || (n.sf || "").toLowerCase().indexOf(q) !== -1) set.add(n.id);
    });
    searchMatches = set;
    selected = null;
    inspector.classList.remove("open");
    searchCount.textContent = set.size + " match" + (set.size === 1 ? "" : "es");
  });
  searchInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && searchMatches && searchMatches.size >= 1) {
      var firstId = searchMatches.values().next().value;
      if (firstId) selectNode(byId[firstId]);
    }
    if (e.key === "Escape") { searchInput.value = ""; searchMatches = null; searchCount.textContent = ""; }
  });

  document.getElementById("node-total").textContent = nodes.length + " nodes";
  document.getElementById("stat-nodes").textContent = nodes.length;
  document.getElementById("stat-edges").textContent = links.length;
  var comms = new Set();
  nodes.forEach(function (n) { if (n.community) comms.add(n.community); });
  document.getElementById("stat-comms").textContent = comms.size;

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  requestAnimationFrame(render);
})();
</script>
