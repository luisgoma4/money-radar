6-10-09"}, {"opportunity_id": "fecyt-fcc-2026", "field": "archive_reason", "old_value": null, "new_value": "Deadline passed; kept to prepare the next edition", "changed_on": "2026-10-09"}, {"opportunity_id": "fecyt-fcc-2026", "field": "archived", "old_value": "0", "new_value": "1", "changed_on": "2026-10-09"}, {"opportunity_id": "cdti-neotec-2026", "field": "lines", "old_value": "causality,tech", "new_value": "causality,branchout", "changed_on": "2026-10-09"}, {"opportunity_id": "enisa-prestamo-participativo", "field": "fit", "old_value": "Working capital for Causality Graphs (or another tech venture) once it is an SL with matching own funds.", "new_value": "Working capital for Causality Graphs (or a BranchOut startup) once it is an SL with matching own funds.", "changed_on": "2026-10-09"}, {"opportunity_id": "enisa-prestamo-participativo", "field": "lines", "old_value": "causality,tech", "new_value": "causality,branchout", "changed_on": "2026-10-09"}, {"opportunity_id": "eic-accelerator-2026-11", "field": "lines", "old_value": "causality,tech", "new_value": "causality,branchout", "changed_on": "2026-10-09"}, {"opportunity_id": "nlnet-2026-11", "field": "lines", "old_value": "tech,causality", "new_value": "branchout,causality", "changed_on": "2026-10-09"}], "lessons": ["2026-10-09 (municipalities): Use BDNS to compare councils. Pull all calls of a council with `convocatorias/busqueda` (keyword + filter on nivel2), then the awards. Open culture calls in these towns are small (Las Rozas EUR 20k split evenly). The real municipal money goes through nominative agreements (convenios) with established entities, so track agreements, not only calls. Decreto 11/2018 school-premises use is region-wide and open to non-associations. Still unknown: SEMF's exact registry, and each town's rule for registering a branch (delegación) of an association based elsewhere.", "2026-10-09 (strategy): First planner pass. M_CERT (certificates and e-signature, about 2 weeks) unlocks the most calls, so do it first. The foundation (about 20 weeks) and the Las Rozas registered office unlock the largest-value municipal path (convenios). SEMF can already apply to FECYT and COST without waiting for the foundation, if its registration is confirmed. COST OC-2026-1 is late (preparation should have started on 16 Sep).", "2026-10-09 (calendar/graph): The calendar shows, as \"late\", the start dates and milestones that are already past for EIC, COST and NEB, plus the IDIPHISA partnership. The next hard dates are certificates/e-signature (27 Nov) and the asociación local (13 Jan) to reach the 2027 municipal calls. Causality Graphs is confirmed as a company, and the CSIC PI and UNED partners were added: CaixaResearch Health can now be led by CSIC (neuroscience is one of its areas), with no milestone pending.", "2026-10-09 (causal layer): The ecosystem is now one DAG for 2D and 3D: factors, partners, entities, faces, products, milestones and calls, with weights. An organisational link (\"la fundación agrupa a Causality\") created a false cycle through the money flow, so keep organisation and causation apart. Main confounders: fondos propios (16 calls) and sede en Las Rozas (13). Key mediator: Causality Graphs.", "2026-10-09 (voice oracle): `claude -p --json-schema` returns the reply in `structured_output`. Sonnet answers in about 3.5 s without tools and about 17 s when it reads state; local intents cover the frequent commands instantly. Mutations must go through a server-side preview token so the LLM cannot skip confirmation. Edits to build.py and strategy.json need back-up, monitor and restore: a weight or relation change can create a DAG cycle.", "2026-10-09 (world surface): Added the diamond (Fundación + Política, Bancos, Arte) and 14 funders: 82 nodes, 251 relations. The spheres must be exogenous (world → us); a Fundación → Bancos edge closes a cycle through fondos propios. Our own canvas Espacio replaced the external graphify viewer, so the 3D is controllable by the oracle, keeps accents, and is rebuilt by the cloud routine.", "2026-10-12 (CosmoVentures + investors): Added the sixth face `cosmo` (CosmoVentures SASU, Paris: science consulting, AI-evaluation benchmarks, browser science games, art-astronomy workshops), a `France` scope and 13 investor/private-funder rows (kind `equity` for funds, angels and crowdfunding). Useful official sources: bstartup.bancsabadell.com (tickets up to EUR 200k; BStartup Health closed 19 Jul 2026, Demo Day 14 Oct), madrimasd.org BAN page (average EUR 280k), iese.edu BAN, ship2b.org (Montana children's-health fund, EUR 35M first close), funds.effectivealtruism.org (the LTFF closed in 2026; the Transformative AI Fund replaces it, USD 10k–150k, rolling). Blocked or unreadable: bpifrance.fr (403), CDTI Innvierte PDFs, cnc.fr FAJV page (404), so those rows are unverified. Gaps: the Région Île-de-France innovation aid, Initiative Paris, edtech/AI seed funds in Spain and France, and the BStartup Health 2026 investees after 14 Oct.", "2026-10-12 (world octahedron): The diamond now has six spheres (Política, Bancos, Arte + Ciencia, Tecnología, Sociedad) as the vertices of an octahedron with the Fundación at the centre (`graph.figure`). Its 12 edges are drawn as geometry, not causes; the causal edges among spheres stay a DAG with Sociedad as the root (Tecnología → Sociedad would close a loop through Política and Ciencia). Soft shell forces let the repulsion push nodes out of the figure, so both 3D views and the 2D hexagon use hard radial bounds. Spheres are now excluded from mediators, since Política gained a parent.", "2026-10-12 (octahedron visible): With funders and calls outside the figure, the octahedron got lost in the cloud of nodes. Now, only in the version with the world, the six spheres are the extremes: every node is clamped inside the octahedron (sum of |projections| on its three axes ≤ 0.9 R) or, in 2D, inside the hexagon, and funders lean towards their sphere's corner. The frame is drawn thicker. The version without the world keeps its old layout.", "2026-10-12 (octahedron around the graph): Clamping nodes inside the figure crowded them, and force-graph's built-in centring averaged the spheres too, which then followed that centre: a feedback loop that drifted the graph away. Now world nodes exert no force on ours (charge 0, link strength 0, no collision), our graph is centred on its own centroid, and the regular octahedron (smallest that holds every node, +8%) is placed around it each tick; funders sit between the graph and their sphere. Headless Chrome does not run force-graph's rAF/zoom timers, so test 2D framing in a real browser; a warm-up (warmupTicks) gives settled positions to measure."], "plan": {"today": "2026-10-12", "now": {"active": [], "milestones": ["M_CERT", "M_PRODUCTO", "M_EU_PIC", "M_SEDE_LR", "M_FUND"], "recommended": [{"id": "caixaresearch-health-next", "name": "CaixaResearch Health Research Call (next edition)", "grade": "A", "score": 82, "when": "tbd", "start_by": null, "target": null, "pending": []}, {"id": "taif-ea-funds", "name": "Transformative AI Fund (EA Funds) — grants for AI safety work", "grade": "A", "score": 72, "when": "rolling", "start_by": null, "target": null, "pending": []}, {"id": "lasrozas-convenios-entidades", "name": "Las Rozas — direct collaboration agreements (convenios / subvenciones nominativas) with associations and foundations", "grade": "B", "score": 67, "when": "rolling", "start_by": null, "target": null, "pending": ["M_LR_REUNION", "M_FUND", "M_SEDE_LR"]}, {"id": "fecyt-fcc-2026", "name": "FECYT Ayudas para el Fomento de la Cultura Científica 2026", "grade": "B", "score": 66, "when": "start_by", "start_by": "2027-07-08", "target": "2027-09-16", "pending": ["M_SEMF_REG"]}, {"id": "startup-europe-2027", "name": "Horizon Europe Startup Europe (HORIZON-EIE-2027-01-CONNECT-01)", "grade": "B", "score": 65, "when": "start_by", "start_by": "2027-05-26", "target": "2027-09-15", "pending": ["M_EU_PIC", "M_CERT" <script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const EMBED = new URLSearchParams(location.search).has("embed");
  // Two copies of the graph: with the world (diamond + funders) or without it (?world=0), as it was before.
  let WORLD = new URLSearchParams(location.search).get("world") !== "0";
  if (EMBED) document.body.classList.add("embed");
  const FACE_NODE = { cloudy: "f_cloudy", semf: "f_semf", causality: "f_cg", branchout: "f_bo", delfina: "e_fund", cosmo: "f_cosmo" };
  let CORE = ["e_fund"];  // the centre plus the vertices of the world figure (set in load())
  const KIND_ES = { entity: "figura legal", face: "cara", product: "producto", partner: "socio", factor: "factor de contexto",
    milestone: "hito", call: "convocatoria", sphere: "esfera del mundo", funder: "financiador" };
  let CS = getComputedStyle(document.documentElement);
  const css = (v) => CS.getPropertyValue(v).trim();  // CS is refreshed once per frame (theme changes)
  const $ = (id) => document.getElementById(id);
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid);
    return n;
  }

  // ------------------------------------------------------------------ graph model
  let G, byId, out, inn;
  function load() {
    G = WORLD || !DATA.plan.ecosystem_base ? DATA.plan.ecosystem : DATA.plan.ecosystem_base;
    $("sub-world").textContent = WORLD ? "el diamante: un octaedro (Política · Bancos · Arte · Ciencia · Tecnología · Sociedad) con la Fundación en el centro" : "sin el diamante ni los financiadores";
    const wb = $("world"); if (wb) { wb.textContent = WORLD ? "Quitar diamante" : "◇ Mostrar diamante"; wb.setAttribute("aria-pressed", String(WORLD)); }
    byId = {}; out = {}; inn = {};
    G.nodes.forEach((n) => { byId[n.id] = n; out[n.id] = []; inn[n.id] = []; });
    G.edges.forEach((e) => { if (byId[e.from] && byId[e.to]) { out[e.from].push(e); inn[e.to].push(e); } });
    const fig = G.figure;
    CORE = fig ? [fig.centre || "e_fund", ...Object.keys(fig.vertices)] : ["e_fund"];
    layout();
    $("nodes-list").replaceChildren(...G.nodes.map((n) => el("option", { value: n.label })));
  }
  const existsNode = (n) => !(n.status === "planned" || n.status === "proposed");
  function colorOf(n) {
    if (n.kind === "sphere") return css("--world-sphere");
    if (n.kind === "funder") return css("--world-funder");
    if (n.kind === "milestone" || !n.face) return css("--muted");
    return css("--line-" + n.face);
  }
  function radiusOf(n) {
    return { sphere: 15, entity: n.id === "e_fund" ? 15 : 9, face: 10, funder: 7, product: 6.5, partner: 7, factor: 7, milestone: 4.5, call: 6 }[n.kind] || 6;
  }

  // ------------------------------------------------------------------ deterministic 3D layout
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  let VIEW_DIST = 700;  // camera distance that frames the whole graph (bigger with the octahedron around it)
  function layout() {
    // Our graph is laid out exactly as without the world: same seed, nodes, edges and forces, the Fundación at the
    // centre. With the world, the octahedron (planner.figure) is then built AROUND it: regular (its 12 edges equal),
    // centred on the Fundación and just big enough for its inscribed sphere to wrap the graph. Funders sit between
    // the graph and their strongest sphere. World nodes never push or pull our nodes.
    const rand = rng(7), fig = G.figure, isWorld = (n) => n.kind === "sphere" || n.kind === "funder";
    const N = G.nodes.filter((n) => !isWorld(n)), inBase = new Set(N.map((n) => n.id));
    const E = G.edges.filter((e) => inBase.has(e.from) && inBase.has(e.to));
    const shell = { entity: 150, face: 175, product: 220, partner: 200, factor: 190, milestone: 280, call: 330 };
    G.nodes.forEach((n) => { n.fixed = false; });
    N.forEach((n) => {
      if (n.id === "e_fund") { n.x = n.y = n.z = 0; n.fixed = true; return; }
      const u = rand() * 2 - 1, th = rand() * Math.PI * 2, r = (shell[n.kind] || 180) * (0.85 + rand() * 0.3), s = Math.sqrt(1 - u * u);
      n.x = r * s * Math.cos(th); n.y = r * u; n.z = r * s * Math.sin(th);
    });
    for (let it = 0; it < 260; it++) {
      const cool = 1 - it / 260;
      N.forEach((n) => { n.vx = 0; n.vy = 0; n.vz = 0; });
      for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
        const a = N[i], b = N[j];
        let dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z, d2 = dx * dx + dy * dy + dz * dz + 0.01;
        if (d2 > 160000) continue;
        const f = 2600 / d2, d = Math.sqrt(d2);
        dx /= d; dy /= d; dz /= d;
        a.vx += dx * f; a.vy += dy * f; a.vz += dz * f; b.vx -= dx * f; b.vy -= dy * f; b.vz -= dz * f;
      }
      E.forEach((e) => {
        const a = byId[e.from], b = byId[e.to];
        const rest = (a.kind === "call" || b.kind === "call") ? 95 : 70;
        let dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z; const d = Math.sqrt(dx * dx + dy * dy + dz * dz) + 0.01;
        const f = (d - rest) * 0.012 * (0.4 + (e.weight ?? 0.5));
        dx /= d; dy /= d; dz /= d;
        a.vx += dx * f; a.vy += dy * f; a.vz += dz * f; b.vx -= dx * f; b.vy -= dy * f; b.vz -= dz * f;
      });
      N.forEach((n) => {
        if (n.fixed) return;
        const sh = shell[n.kind] || 180, d = Math.sqrt(n.x * n.x + n.y * n.y + n.z * n.z) + 0.01, pull = (d - sh) * 0.02;
        n.vx -= n.x / d * pull; n.vy -= n.y / d * pull; n.vz -= n.z / d * pull;
        const cap = 12 * cool + 1;
        n.x += Math.max(-cap, Math.min(cap, n.vx)); n.y += Math.max(-cap, Math.min(cap, n.vy)); n.z += Math.max(-cap, Math.min(cap, n.vz));
      });
    }
    let m = 0; N.forEach((n) => { m = Math.max(m, Math.sqrt(n.x * n.x + n.y * n.y + n.z * n.z) + radiusOf(n)); });
    VIEW_DIST = Math.max(700, m * 2);
    if (!fig) return;
    const V = {};
    Object.entries(fig.vertices).forEach(([id, v]) => { V[id] = [v[0], -v[1], v[2]]; });  // screen y points down
    // The smallest regular octahedron that holds every node (+8%): p is inside when |p·a1| + |p·a2| + |p·a3| <= R.
    const axes = (fig.top || []).map((id) => V[id]).filter(Boolean);
    let L = 0;
    N.forEach((n) => { L = Math.max(L, axes.reduce((s, a) => s + Math.abs(n.x * a[0] + n.y * a[1] + n.z * a[2]), 0) + radiusOf(n) * 1.7); });
    const R = 1.08 * (axes.length === 3 ? L : Math.sqrt(3) * m);
    VIEW_DIST = R * 2.1;
    Object.entries(V).forEach(([id, v]) => { const n = byId[id]; if (n) { n.x = v[0] * R; n.y = v[1] * R; n.z = v[2] * R; n.fixed = true; } });
    const groups = {};
    G.nodes.filter((n) => n.kind === "funder").forEach((n) => {
      const s = inn[n.id].filter((e) => V[e.from]).sort((a, b) => (b.weight ?? 0) - (a.weight ?? 0))[0];
      if (s) (groups[s.from] = groups[s.from] || []).push(n);
    });
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    const unit = (a) => { const l = Math.hypot(...a) || 1; return a.map((x) => x / l); };
    Object.entries(groups).forEach(([sid, fs]) => {  // a small ring around the axis, at 72% of the way to the vertex
      const c = V[sid], u = unit(cross(c, Math.abs(c[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0])), w = cross(c, u);
      const ring = fs.length > 1 ? 0.12 * R : 0;
      fs.forEach((n, i) => {
        const a = (2 * Math.PI * i) / fs.length, ca = Math.cos(a) * ring, sa = Math.sin(a) * ring;
        n.x = c[0] * 0.72 * R + u[0] * ca + w[0] * sa; n.y = c[1] * 0.72 * R + u[1] * ca + w[1] * sa; n.z = c[2] * 0.72 * R + u[2] * ca + w[2] * sa;
        n.fixed = true;
      });
    });
  }

  // ------------------------------------------------------------------ camera and rendering
  const canvas = $("stage"), ctx = canvas.getContext("2d");
  let W, H, DPR;
  function resize() { DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; canvas.width = W * DPR; canvas.height = H * DPR; canvas.style.width = W + "px"; canvas.style.height = H + "px"; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
  addEventListener("resize", resize); resize();
  const cam = { yaw: 0.5, pitch: -0.25, dist: VIEW_DIST * 1.3, tx: 0, ty: 0, tz: 0, goal: { x: 0, y: 0, z: 0, dist: VIEW_DIST }, spin: !EMBED };
  const focal = 700;
  let focusId = null, hoverId = null, path = [], pathT = 0, trail = [];
  function project(n) {
    const x = n.x - cam.tx, y = n.y - cam.ty, z = n.z - cam.tz;
    const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const x1 = x * cy - z * sy, z1 = x * sy + z * cy, y1 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
    const zc = Math.max(8, z2 + cam.dist), s = focal / zc;
    return { sx: W / 2 + x1 * s, sy: H / 2 + y1 * s, s, z: zc };
  }
  const neighborsOf = (id) => new Set([...(out[id] || []).map((e) => e.to), ...(inn[id] || []).map((e) => e.from)]);
  function shape(n, p, r, fill, stroke, hollow, dashed) {
    ctx.beginPath();
    if (n.kind === "sphere") { ctx.moveTo(p.sx, p.sy - r * 1.25); ctx.lineTo(p.sx + r, p.sy); ctx.lineTo(p.sx, p.sy + r * 1.25); ctx.lineTo(p.sx - r, p.sy); ctx.closePath(); }
    else if (n.kind === "funder") { ctx.rect(p.sx - r, p.sy - r, 2 * r, 2 * r); }
    else ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
    if (hollow) { ctx.fillStyle = css("--surface"); ctx.fill(); ctx.setLineDash(dashed); ctx.strokeStyle = stroke; ctx.lineWidth = 1.8; ctx.stroke(); ctx.setLineDash([]); }
    else { ctx.fillStyle = fill; ctx.fill(); if (n.kind === "factor") { ctx.strokeStyle = css("--surface"); ctx.lineWidth = 1.5; ctx.stroke(); } }
  }
  function render(t) {
    CS = getComputedStyle(document.documentElement);
    cam.tx += (cam.goal.x - cam.tx) * 0.08; cam.ty += (cam.goal.y - cam.ty) * 0.08; cam.tz += (cam.goal.z - cam.tz) * 0.08;
    cam.dist += (cam.goal.dist - cam.dist) * 0.08;
    if (cam.spin && !drag) cam.yaw += 0.0012;
    ctx.clearRect(0, 0, W, H);
    const P = {}; G.nodes.forEach((n) => { P[n.id] = project(n); });
    const nb = focusId ? neighborsOf(focusId) : null;
    const onPath = new Set(); for (let i = 0; i + 1 < path.length; i++) onPath.add(path[i] + ">" + path[i + 1]);
    const ink = css("--ink"), accent = css("--accent"), edge = css("--edge");
    // edges
    G.edges.forEach((e) => {
      const a = P[e.from], b = P[e.to]; if (!a || !b) return;
      const isPath = onPath.has(e.from + ">" + e.to) || onPath.has(e.to + ">" + e.from);
      const isFocus = focusId && (e.from === focusId || e.to === focusId);
      const dim = (focusId || path.length) && !isPath && !isFocus;
      const s = Math.min(1.6, (a.s + b.s) / 2);
      ctx.globalAlpha = dim ? 0.18 : 1;
      ctx.strokeStyle = isPath ? accent : isFocus ? colorOf(byId[e.from === focusId ? e.to : e.from]) : edge;
      ctx.lineWidth = (0.5 + 2.4 * (e.weight ?? 0.5)) * s * (isPath ? 1.6 : 1);
      ctx.setLineDash(e.status === "planned" ? [5 * s, 4 * s] : []);
      ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
      ctx.setLineDash([]);
      if (isFocus || isPath) {  // direction arrow (cause -> effect)
        const mx = a.sx + (b.sx - a.sx) * 0.62, my = a.sy + (b.sy - a.sy) * 0.62, ang = Math.atan2(b.sy - a.sy, b.sx - a.sx), L = 7 * s;
        ctx.fillStyle = ctx.strokeStyle; ctx.beginPath(); ctx.moveTo(mx + Math.cos(ang) * L, my + Math.sin(ang) * L);
        ctx.lineTo(mx + Math.cos(ang + 2.5) * L, my + Math.sin(ang + 2.5) * L); ctx.lineTo(mx + Math.cos(ang - 2.5) * L, my + Math.sin(ang - 2.5) * L); ctx.fill();
      }
    });
    // the world figure: faces barely tinted, the 12 edges of the octahedron (geometry, not causes) always visible
    const sph = css("--world-sphere"), fig = G.figure;
    if (fig) {
      const V = Object.keys(fig.vertices), framed = new Set(fig.frame.map(([a, b]) => a + "|" + b));
      const adj = (a, b) => framed.has(a + "|" + b) || framed.has(b + "|" + a);
      ctx.fillStyle = sph; ctx.globalAlpha = 0.06;
      for (let i = 0; i < V.length; i++) for (let j = i + 1; j < V.length; j++) for (let k = j + 1; k < V.length; k++) {
        if (!adj(V[i], V[j]) || !adj(V[j], V[k]) || !adj(V[i], V[k])) continue;
        const a = P[V[i]], b = P[V[j]], c = P[V[k]]; if (!a || !b || !c) continue;
        ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.lineTo(c.sx, c.sy); ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha = 0.8; ctx.strokeStyle = sph; ctx.lineWidth = 2.2;
      fig.frame.forEach(([x, y]) => { const a = P[x], b = P[y]; if (!a || !b) return; ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke(); });
    }
    // causal relations inside the core (sphere -> sphere, sphere -> Fundación): highlighted over the other edges
    const coreSet = new Set(CORE);
    G.edges.forEach((e) => {
      if (!coreSet.has(e.from) || !coreSet.has(e.to)) return;
      const a = P[e.from], b = P[e.to];
      ctx.globalAlpha = 0.85; ctx.strokeStyle = sph; ctx.lineWidth = 2.6 * Math.min(1.6, (a.s + b.s) / 2);
      ctx.setLineDash(e.status === "planned" ? [7, 5] : []);
      ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke(); ctx.setLineDash([]);
    });
    // travelling pulse along the path
    if (path.length > 1) {
      pathT = (pathT + 0.012) % (path.length - 1);
      const i = Math.floor(pathT), f = pathT - i, a = P[path[i]], b = P[path[i + 1]];
      if (a && b) { ctx.globalAlpha = 1; ctx.fillStyle = accent; ctx.beginPath(); ctx.arc(a.sx + (b.sx - a.sx) * f, a.sy + (b.sy - a.sy) * f, 5, 0, Math.PI * 2); ctx.fill(); }
    }
    // nodes, far to near
    const order = G.nodes.slice().sort((a, b) => P[b.id].z - P[a.id].z);
    const pathSet = new Set(path);
    const labels = [];
    order.forEach((n) => {
      const p = P[n.id], r = radiusOf(n) * Math.min(2.2, p.s / 1.2);
      const lit = n.id === focusId || (nb && nb.has(n.id)) || pathSet.has(n.id) || CORE.includes(n.id) || n.id === hoverId;
      ctx.globalAlpha = (focusId || path.length) && !lit ? 0.22 : Math.max(0.55, Math.min(1, p.s));
      const c = colorOf(n);
      const hollow = !existsNode(n) || n.pending;
      shape(n, p, r, c, c, hollow, n.pending ? [1.5, 3] : [4, 3]);
      if (n.id === focusId) { ctx.globalAlpha = 1; ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 6, 0, Math.PI * 2); ctx.stroke(); }
      if (lit && (CORE.includes(n.id) || n.id === focusId || n.id === hoverId || pathSet.has(n.id) || (nb && nb.has(n.id)))) {
        const txt = (n.kind === "call" ? `[${n.grade}] ` : "") + (n.label.length > 42 ? n.label.slice(0, 41) + "…" : n.label);
        labels.push([txt, p.sx + r + 5, p.sy + 4, CORE.includes(n.id), n.id === focusId]);
      }
    });
    // labels last, over every node (halo keeps them legible on top of edges)
    const page = css("--page");
    labels.forEach(([txt, x, y, isCore, isFocus]) => {
      ctx.globalAlpha = 1;
      ctx.font = `${isCore || isFocus ? 700 : 500} ${isCore ? 14 : 12}px system-ui, -apple-system, sans-serif`;
      ctx.lineWidth = 4; ctx.strokeStyle = page; ctx.strokeText(txt, x, y);

    LAST = P;
    requestAnimationFrame(render);
  }
  let LAST = {};

  // ------------------------------------------------------------------ interaction
  let drag = false, lx = 0, ly = 0, moved = false;
  canvas.addEventListener("pointerdown", (e) => { drag = true; moved = false; lx = e.clientX; ly = e.clientY; cam.spin = false; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", (e) => {
    if (!drag) { hover(e); return; }
    const dx = e.clientX - lx, dy = e.clientY - ly; if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
    cam.yaw += dx * 0.006; cam.pitch = Math.max(-1.4, Math.min(1.4, cam.pitch + dy * 0.006)); lx = e.clientX; ly = e.clientY;
  });
  addEventListener("pointerup", (e) => { if (drag && !moved) { const id = pick(e.clientX, e.clientY); if (id) focus(id); } drag = false; });
  canvas.addEventListener("wheel", (e) => { e.preventDefault(); cam.goal.dist = Math.max(80, Math.min(4000, cam.goal.dist * Math.pow(1.0012, e.deltaY))); }, { passive: false });
  function pick(x, y) {
    let best = null, bd = 18 * 18;
    for (const id in LAST) { const p = LAST[id], dx = p.sx - x, dy = p.sy - y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = id; } }
    return best;
  }
  function hover(e) {
    const id = pick(e.clientX, e.clientY); hoverId = id;
    const tip = $("tip");
    if (!id) { tip.style.display = "none"; canvas.style.cursor = "grab"; return; }
    const n = byId[id]; canvas.style.cursor = "pointer";
    tip.replaceChildren(el("b", {}, n.label), el("div", { style: "color:var(--ink-2)" }, KIND_ES[n.kind] + " · " + statusText(n)));
    tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 14, W - 290) + "px"; tip.style.top = (e.clientY + 14) + "px";
  }
  function statusText(n) {
    if (n.kind === "call") return `grado ${n.grade}` + (n.status === "planned" ? " · próxima edición" : "");
    if (n.kind === "milestone") return n.status === "exists" ? "hecho" : "pendiente";
    if (n.pending) return "socio · relación por crear";
    return { exists: "existe", planned: "por crear", proposed: "propuesta", external: "mundo exterior", factor: "factor" }[n.status] || n.status;
  }

  // ------------------------------------------------------------------ navigation API (also used by the oracle)
  function flyTo(n, dist) { cam.goal = { x: n.x, y: n.y, z: n.z, dist: dist || 260 }; cam.spin = false; }
  function focus(id, opts = {}) {
    const n = byId[id]; if (!n) return false;
    focusId = id; if (!opts.keepPath) path = [];
    flyTo(n);
    if (trail[trail.length - 1] !== id) { trail.push(id); trail = trail.slice(-10); }
    renderCard(); renderTrail();
    return true;
  }
  function core() { focusId = null; path = []; cam.goal = { x: 0, y: 0, z: 0, dist: VIEW_DIST }; $("card").classList.remove("open"); renderTrail(); }
  function showPath(ids) {
    ids = ids.filter((i) => byId[i]); if (!ids.length) return;
    path = ids; pathT = 0; focusId = ids[ids.length - 1];
    const cx = ids.reduce((s, i) => s + byId[i].x, 0) / ids.length, cy = ids.reduce((s, i) => s + byId[i].y, 0) / ids.length, cz = ids.reduce((s, i) => s + byId[i].z, 0) / ids.length;
    const spread = Math.max(...ids.map((i) => Math.hypot(byId[i].x - cx, byId[i].y - cy, byId[i].z - cz)));
    cam.goal = { x: cx, y: cy, z: cz, dist: Math.max(260, spread * 3.2) }; cam.spin = false;
    ids.forEach((i) => { if (trail[trail.length - 1] !== i) trail.push(i); }); trail = trail.slice(-10);
    renderCard(); renderTrail();
  }
  function renderCard() {
    const card = $("card"), n = byId[focusId];
    if (!n) { card.classList.remove("open"); return; }
    const rel = (e, dir) => {
      const other = byId[dir === "out" ? e.to : e.from];
      return el("button", { type: "button", class: "rel" + (e.status === "planned" ? " planned" : ""), onclick: () => focus(other.id),
        title: `${dir === "out" ? "→" : "←"} ${other.label} · ${e.label} · peso ${(e.weight ?? 0.5).toFixed(2)}${e.status === "planned" ? " (por crear)" : ""}` },
        el("span", { "aria-hidden": "true" }, dir === "out" ? "→" : "←"),
        el("span", { class: "lab" }, other.label, " ", el("small", {}, "· " + e.label)),
        el("span", { class: "w" }, (e.weight ?? 0.5).toFixed(2)));
    };
    const ins = inn[n.id].slice().sort((a, b) => (b.weight ?? .5) - (a.weight ?? .5));
    const outs = out[n.id].slice().sort((a, b) => (b.weight ?? .5) - (a.weight ?? .5));
    card.replaceChildren(
      el("div", { class: "kind", style: `color:${colorOf(n)}` }, KIND_ES[n.kind] || n.kind),
      el("h2", {}, (n.kind === "call" ? `[${n.grade}] ` : "") + n.label),
      el("div", {}, el("span", { class: "pill" + (existsNode(n) && !n.pending ? "" : " no") }, statusText(n)),
        n.kind === "call" ? el("a", { class: "pill", href: "dashboard.html#call:" + encodeURIComponent(n.id.slice(2)), target: EMBED ? "_top" : "dashboard" }, "Ficha en el dashboard ↗") : null),
      n.detail ? el("p", { class: "detail" }, n.detail) : null,
      ins.length ? el("h3", {}, `Causas (${ins.length})`) : null, ...ins.map((e) => rel(e, "in")),
      outs.length ? el("h3", {}, `Efectos (${outs.length})`) : null, ...outs.map((e) => rel(e, "out")));
    card.classList.add("open");
  }
  function renderTrail() {
    const t = $("trail");
    t.classList.toggle("open", trail.length > 0);
    t.replaceChildren(el("span", { style: "color:var(--muted)" }, "Ruta:"), ...trail.flatMap((id, i) => [i ? el("span", { "aria-hidden": "true", style: "color:var(--muted)" }, "›") : null,
      el("button", { type: "button", onclick: () => focus(id) }, byId[id] ? byId[id].label : id)]).filter(Boolean));
  }
  function banner(text) { const b = $("banner"); b.textContent = text || ""; b.classList.toggle("open", !!text); }

  // ------------------------------------------------------------------ chrome
  function legend() {
    const L = [["--line-cloudy", "Cloudy"], ["--line-semf", "SEMF"], ["--line-causality", "Causality"], ["--line-branchout", "BranchOut"], ["--line-delfina", "Fundación"], ["--line-cosmo", "CosmoVentures"]];
    $("legend").replaceChildren(...L.map(([v, t]) => el("span", {}, el("i", { style: `background:var(${v})` }), t)),
      ...(WORLD ? [el("span", {}, el("i", { class: "dia", style: "background:var(--world-sphere)" }), "esfera"),
        el("span", {}, el("i", { class: "sq", style: "background:var(--world-funder)" }), "financiador")] : []),
      el("span", {}, el("i", { style: "background:var(--muted)" }), "hito"),
      el("span", {}, el("i", { class: "hol" }), "aún no existe"));
  }
  $("find").addEventListener("change", (e) => { const q = e.target.value.toLowerCase(); const n = G.nodes.find((x) => x.label.toLowerCase() === q) || G.nodes.find((x) => x.label.toLowerCase().includes(q)); if (n) focus(n.id); e.target.value = ""; });
  $("to-core").addEventListener("click", core);
  $("spin").addEventListener("click", () => { cam.spin = !cam.spin; });
  function setWorld(on) {
    WORLD = !!on;
    const u = new URL(location.href); if (WORLD) u.searchParams.delete("world"); else u.searchParams.set("world", "0");
    history.replaceState(null, "", u);
    const keep = focusId; load(); legend(); if (keep && byId[keep]) focus(keep); else core();
  }
  $("world").addEventListener("click", () => setWorld(!WORLD));
  addEventListener("keydown", (e) => { if (e.key === "Escape") core(); });

  load(); legend(); cam.goal.dist = VIEW_DIST; cam.dist = VIEW_DIST * 1.3; requestAnimationFrame(render);
  if (location.hash.length > 1) {
    const [kind, id] = decodeURIComponent(location.hash.slice(1)).split(":");
    const nid = kind === "call" ? "c_" + id : kind === "milestone" ? "m_" + id : kind === "face" ? (FACE_NODE[id] || id) : id;
    if (kind === "core") core(); else setTimeout(() => focus(nid), 300);
  }

  // ------------------------------------------------------------------ oracle host adapter
  function directView(v) {
    if (!v) return;
    if (v.camera === "in") { cam.goal.dist = Math.max(80, cam.goal.dist * 0.6); return; }
    if (v.camera === "out") { cam.goal.dist = Math.min(4000, cam.goal.dist * 1.6); return; }
    if (v.camera === "spin") { cam.spin = true; return; }
    if (v.camera === "stop") { cam.spin = false; return; }
    if ((v.world === true || v.world === false) && v.world !== WORLD) setWorld(v.world);
    const want = (v.path || []).concat(v.focus && v.focus.kind === "node" ? [v.focus.id] : []);
    if (!WORLD && want.some((i) => !byId[i] && DATA.plan.ecosystem.nodes.some((n) => n.id === i))) setWorld(true);  // a sphere or funder: show the world
    if (v.path && v.path.length) return showPath(v.path);
    const f = v.focus;
    if (!f) return v.tab && v.tab !== "graph" ? banner("Eso se ve mejor en el dashboard") : core();
    if (f.kind === "core") return core();
    if (f.kind === "phase") { const ph = (DATA.plan.oracle.phases || []).find((p) => p.id === f.id); banner(ph ? "Ceremonia · " + ph.name : ""); if (!focusId) core(); return; }
    if (f.kind === "now" || f.kind === "gantt") { banner(f.kind === "now" ? "Qué hacer ahora" : "Calendario"); return core(); }
    const id = f.kind === "call" ? "c_" + f.id : f.kind === "milestone" ? "m_" + f.id : f.kind === "face" ? (FACE_NODE[f.id] || f.id) : f.id;
    focus(id);
  }
  async function refresh() {
    const fresh = await (await fetch("/api/state")).json();
    Object.keys(DATA).forEach((k) => delete DATA[k]); Object.assign(DATA, fresh);
    const keep = focusId; load(); if (keep && byId[keep]) focus(keep); else renderCard();
  }
  if (!EMBED && window.OracleDock) OracleDock.init({
    page: "espacio",
    plan: () => DATA.plan,
    view: () => ({ tab: "espacio", focus: focusId ? { kind: "node", id: focusId } : null, path, graph: { mode: "3d", world: WORLD } }),
    directView, refresh,
    onPhase: (id) => { const ph = id && (DATA.plan.oracle.phases || []).find((p) => p.id === id); banner(ph ? "Ceremonia · " + ph.name : ""); },
  });
  // Theme sync when embedded in the dashboard (the parent sets data-theme on this document).
  window.addEventListener("message", (e) => { if (e.origin === location.origin && e.data && e.data.theme) document.documentElement.dataset.theme = e.data.theme; });
})();
</script>
