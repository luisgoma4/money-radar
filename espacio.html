ality Graphs (or another tech venture) once it is an SL with matching own funds.", "new_value": "Working capital for Causality Graphs (or a BranchOut startup) once it is an SL with matching own funds.", "changed_on": "2026-10-09"}, {"opportunity_id": "enisa-prestamo-participativo", "field": "lines", "old_value": "causality,tech", "new_value": "causality,branchout", "changed_on": "2026-10-09"}, {"opportunity_id": "eic-accelerator-2026-11", "field": "lines", "old_value": "causality,tech", "new_value": "causality,branchout", "changed_on": "2026-10-09"}, {"opportunity_id": "nlnet-2026-11", "field": "lines", "old_value": "tech,causality", "new_value": "branchout,causality", "changed_on": "2026-10-09"}], "lessons": ["2026-10-08: Pages that work with WebFetch: cost.eu, nlnet.nl, eic.ec.europa.eu, and the enisa.es startups page. BOE and COST PDFs come back as binary; save them and run `pdftotext`. caixaresearch.org returns 403, and the old ENISA line URL returns 404. The Funding & Tenders portal needs JavaScript, so use Euresearch / national contact point alerts as the secondary source and mark those rows unverified.", "2026-10-08: Gaps for next run: Cloudy has no open call yet. Search Comunidad de Madrid and Ayuntamiento de Madrid culture/science outreach grants, Ministerio de Juventud e Infancia, Creative Europe, and children's book prizes. SEMF: find out whether the Valencia summer school can get Generalitat Valenciana or Ayuntamiento de València funding.", "2026-10-09 (BranchOut deep dive): A coworking + coliving hub sits between three funding families. (1) Housing: the Plan Estatal de Vivienda 2026–2030 funds coliving only under 20-year capped-rent protection, and press reports say Madrid won't join the plan. (2) Ecosystem-building: Horizon Startup Europe 2027 and NEB, both consortium-only. (3) Rural: LEADER and demographic-challenge funds, often only for municipalities. Location and legal form decide which family applies; ask for them before searching further. Good sources: comunidad.madrid/inversion/innova (lists the always-open lines), new-european-bauhaus.europa.eu, boe.es/eli for decrees. Next gaps: private real-estate / impact investors for coliving, ICO lines, and the Madrid city council incubator network.", "2026-10-09 (Madrid West): Municipal calls in Las Rozas, Majadahonda and Pozuelo are published as short BOCM extracts with a BDNS id. Search BOCM + BDNS, save the PDF and run pdftotext. Windows can be very short (Pozuelo culture: 15 days), so registered office and municipal registration must be in place beforehand. Las Rozas lends cultural-centre rooms free, but only to registered cultural associations. Next gaps: Majadahonda and Pozuelo space cession for associations, the Las Rozas 2026–27 cession call, Comunidad de Madrid grants to non-profits, and private patrons / mecenazgo for the foundation.", "2026-10-09 (winners): The BDNS public API gives award lists by call number with no login: `concesiones/busqueda?numeroConvocatoria=N`. Unknown filter params are silently ignored, which returns every award in Spain. FECYT, CDTI and Majadahonda upload their awards; Pozuelo culture does not. Winner data changed the strategy: FECYT median is EUR 20.5k (ask 15–25k, not 100k), NEOTEC winners max out the PhD-hire cap, Majadahonda Emprende is mostly non-tech local businesses.", "2026-10-09 (municipalities): Use BDNS to compare councils. Pull all calls of a council with `convocatorias/busqueda` (keyword + filter on nivel2), then the awards. Open culture calls in these towns are small (Las Rozas EUR 20k split evenly). The real municipal money goes through nominative agreements (convenios) with established entities, so track agreements, not only calls. Decreto 11/2018 school-premises use is region-wide and open to non-associations. Still unknown: SEMF's exact registry, and each town's rule for registering a branch (delegación) of an association based elsewhere.", "2026-10-09 (strategy): First planner pass. M_CERT (certificates and e-signature, about 2 weeks) unlocks the most calls, so do it first. The foundation (about 20 weeks) and the Las Rozas registered office unlock the largest-value municipal path (convenios). SEMF can already apply to FECYT and COST without waiting for the foundation, if its registration is confirmed. COST OC-2026-1 is late (preparation should have started on 16 Sep).", "2026-10-09 (calendar/graph): The calendar shows, as \"late\", the start dates and milestones that are already past for EIC, COST and NEB, plus the IDIPHISA partnership. The next hard dates are certificates/e-signature (27 Nov) and the asociación local (13 Jan) to reach the 2027 municipal calls. Causality Graphs is confirmed as a company, and the CSIC PI and UNED partners were added: CaixaResearch Health can now be led by CSIC (neuroscience is one of its areas), with no milestone pending.", "2026-10-09 (causal layer): The ecosystem is now one DAG for 2D and 3D: factors, partners, entities, faces, products, milestones and calls, with weights. An organisational link (\"la fundación agrupa a Causality\") created a false cycle through the money flow, so keep organisation and causation apart. Main confounders: fondos propios (16 calls) and sede en Las Rozas (13). Key mediator: Causality Graphs.", "2026-10-09 (voice oracle): `claude -p --json-schema` returns the reply in `structured_output`. Sonnet answers in about 3.5 s without tools and about 17 s when it reads state; local intents cover the frequent commands instantly. Mutations must go through a server-side preview token so the LLM cannot skip confirmation. Edits to build.py and strategy.json need back-up, monitor and restore: a weight or relation change can create a DAG cycle."], "plan": {"today": "2026-10-09", "now": {"active": [], "milestones": ["M_CERT", "M_EU_PIC", "M_PRODUCTO", "M_SEDE_LR", "M_FUND"], "recommended": [{"id": "caixaresearch-health-next", "name": "CaixaResearch Health Research Call (next edition)", "grade": "A", "score": 82, "when": "tbd   }
  function radiusOf(n) {
    return { sphere: 15, entity: n.id === "e_fund" ? 15 : 9, face: 10, funder: 7, product: 6.5, partner: 7, factor: 7, milestone: 4.5, call: 6 }[n.kind] || 6;
  }

  // ------------------------------------------------------------------ deterministic 3D layout
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function layout() {
    const R = 135, rand = rng(7);
    // The diamond: a regular tetrahedron, Fundación on top, the three spheres as the base.
    const fixed = { e_fund: [0, -R, 0] };
    ["s_politica", "s_bancos", "s_arte"].forEach((id, i) => {
      const a = (i / 3) * Math.PI * 2 - Math.PI / 2, r = R * Math.sqrt(8) / 3;

    });
    const shell = { entity: 150, face: 175, product: 220, partner: 200, factor: 190, funder: 250, milestone: 280, call: 330 };
    G.nodes.forEach((n) => {
      if (fixed[n.id]) { [n.x, n.y, n.z] = fixed[n.id]; n.fixed = true; return; }
      n.fixed = false;
      let anchor = [0, 0, 0];
      if (n.kind === "funder") { const s = (inn[n.id].find((e) => byId[e.from] && byId[e.from].kind === "sphere") || {}).from; if (s) anchor = fixed[s].map((v) => v * 1.9); }
      const u = rand() * 2 - 1, th = rand() * Math.PI * 2, r = (shell[n.kind] || 180) * (0.85 + rand() * 0.3), s = Math.sqrt(1 - u * u);

    });
    const N = G.nodes, E = G.edges.filter((e) => byId[e.from] && byId[e.to]);
    for (let it = 0; it < 260; it++) {
      const cool = 1 - it / 260;
      N.forEach((n) => { n.vx = 0; n.vy = 0; n.vz = 0; });
      for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
        const a = N[i], b = N[j];
        let dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z, d2 = dx * dx + dy * dy + dz * dz + 0.01;
        if (d2 > 160000) continue;

        a.vx += dx * f; a.vy += dy * f; a.vz += dz * f; b.vx -= dx * f; b.vy -= dy * f; b.vz -= dz * f;
      }
      E.forEach((e) => {
        const a = byId[e.from], b = byId[e.to];
        const rest = (a.kind === "call" || b.kind === "call") ? 95 : 70;
        let dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z; const d = Math.sqrt(dx * dx + dy * dy + dz * dz) + 0.01;
        const f = (d - rest) * 0.012 * (0.4 + (e.weight ?? 0.5));

        n.x += Math.max(-cap, Math.min(cap, n.vx)); n.y += Math.max(-cap, Math.min(cap, n.vy)); n.z += Math.max(-cap, Math.min(cap, n.vz));

  }

  // ------------------------------------------------------------------ camera and rendering
  const canvas = $("stage"), ctx = canvas.getContext("2d");
  let W, H, DPR;
  function resize() { DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; canvas.width = W * DPR; canvas.height = H * DPR; canvas.style.width = W + "px"; canvas.style.height = H + "px"; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
  addEventListener("resize", resize); resize();
  const cam = { yaw: 0.5, pitch: -0.25, dist: 620, tx: 0, ty: 0, tz: 0, goal: { x: 0, y: -20, z: 0, dist: 520 }, spin: !EMBED };
  const focal = 700;
  let focusId = null, hoverId = null, path = [], pathT = 0, trail = [];
  function project(n) {
    const x = n.x - cam.tx, y = n.y - cam.ty, z = n.z - cam.tz;
    const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);

  }
  const neighborsOf = (id) => new Set([...(out[id] || []).map((e) => e.to), ...(inn[id] || []).map((e) => e.from)]);
  function shape(n, p, r, fill, stroke, hollow, dashed) {
    ctx.beginPath();
    if (n.kind === "sphere") { ctx.moveTo(p.sx, p.sy - r * 1.25); ctx.lineTo(p.sx + r, p.sy); ctx.lineTo(p.sx, p.sy + r * 1.25); ctx.lineTo(p.sx - r, p.sy); ctx.closePath(); }
    else if (n.kind === "funder") { ctx.rect(p.sx - r, p.sy - r, 2 * r, 2 * r); }
    else ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);

    else { ctx.fillStyle = fill; ctx.fill(); if (n.kind === "factor") { ctx.strokeStyle = css("--surface"); ctx.lineWidth = 1.5; ctx.stroke(); } }
  }
  function render(t) {
    CS = getComputedStyle(document.documentElement);
    cam.tx += (cam.goal.x - cam.tx) * 0.08; cam.ty += (cam.goal.y - cam.ty) * 0.08; cam.tz += (cam.goal.z - cam.tz) * 0.08;
    cam.dist += (cam.goal.dist - cam.dist) * 0.08;
    if (cam.spin && !drag) cam.yaw += 0.0012;
    ctx.clearRect(0, 0, W, H);
    const P = {}; G.nodes.forEach((n) => { P[n.id] = project(n); });
    const nb = focusId ? neighborsOf(focusId) : null;
    const onPath = new Set(); for (let i = 0; i + 1 < path.length; i++) onPath.add(path[i] + ">" + path[i + 1]);
    const ink = css("--ink"), accent = css("--accent"), edge = css("--edge");
    // edges
    G.edges.forEach((e) => {
      const a = P[e.from], b = P[e.to]; if (!a || !b) return;
      const isPath = onPath.has(e.from + ">" + e.to) || onPath.has(e.to + ">" + e.from);
      const isFocus = focusId && (e.from === focusId || e.to === focusId);
      const dim = (focusId || path.length) && !isPath && !isFocus;
      const s = Math.min(1.6, (a.s + b.s) / 2);
      ctx.globalAlpha = dim ? 0.18 : 1;
      ctx.strokeStyle = isPath ? accent : isFocus ? colorOf(byId[e.from === focusId ? e.to : e.from]) : edge;
      ctx.lineWidth = (0.5 + 2.4 * (e.weight ?? 0.5)) * s * (isPath ? 1.6 : 1);
      ctx.setLineDash(e.status === "planned" ? [5 * s, 4 * s] : []);
      ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
      ctx.setLineDash([]);
      if (isFocus || isPath) {  // direction arrow (cause -> effect)
        const mx = a.sx + (b.sx - a.sx) * 0.62, my = a.sy + (b.sy - a.sy) * 0.62, ang = Math.atan2(b.sy - a.sy, b.sx - a.sx), L = 7 * s;
        ctx.fillStyle = ctx.strokeStyle; ctx.beginPath(); ctx.moveTo(mx + Math.cos(ang) * L, my + Math.sin(ang) * L);
        ctx.lineTo(mx + Math.cos(ang + 2.5) * L, my + Math.sin(ang + 2.5) * L); ctx.lineTo(mx + Math.cos(ang - 2.5) * L, my + Math.sin(ang - 2.5) * L); ctx.fill();
      }
    });
    // the diamond (Fundación + the three spheres): always visible, drawn over the other edges
    const coreSet = new Set(CORE), sph = css("--world-sphere");
    G.edges.forEach((e) => {
      if (!coreSet.has(e.from) || !coreSet.has(e.to)) return;
      const a = P[e.from], b = P[e.to];
      ctx.globalAlpha = 0.85; ctx.strokeStyle = sph; ctx.lineWidth = 2.6 * Math.min(1.6, (a.s + b.s) / 2);
      ctx.setLineDash(e.status === "planned" ? [7, 5] : []);

      ctx.globalAlpha = (focusId || path.length) && !lit ? 0.22 : Math.max(0.55, Math.min(1, p.s));

      if (lit && (CORE.includes(n.id) || n.id === focusId || n.id === hoverId || pathSet.has(n.id) || (nb && nb.has(n.id)))) {

    const page = css("--page");

  let LAST = {};

  // ------------------------------------------------------------------ interaction

  canvas.addEventListener("pointermove", (e) => {

  addEventListener("pointerup", (e) => { if (drag && !moved) { const id = pick(e.clientX, e.clientY); if (id) focus(id); } drag = false; });
  canvas.addEventListener("wheel", (e) => { e.preventDefault(); cam.goal.dist = Math.max(80, Math.min(1600, cam.goal.dist * Math.pow(1.0012, e.deltaY))); }, { passive: false });
  function pick(x, y) {
    let best = null, bd = 18 * 18;
    for (const id in LAST) { const p = LAST[id], dx = p.sx - x, dy = p.sy - y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = id; } }
    return best;
  }
  function hover(e) {
    const id = pick(e.clientX, e.clientY); hoverId = id;

    if (!id) { tip.style.display = "none"; canvas.style.cursor = "grab"; return; }
    const n = byId[id]; canvas.style.cursor = "pointer";
    tip.replaceChildren(el("b", {}, n.label), el("div", { style: "color:var(--ink-2)" }, KIND_ES[n.kind] + " · " + statusText(n)));
    tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 14, W - 290) + "px"; tip.style.top = (e.clientY + 14) + "px";
  }
  function statusText(n) {
    if (n.kind === "call") return `grado ${n.grade}` + (n.status === "planned" ? " · próxima edición" : "");
    if (n.kind === "milestone") return n.status === "exists" ? "hecho" : "pendiente";
    if (n.pending) return "socio · relación por crear";
    return { exists: "existe", planned: "por crear", proposed: "propuesta", external: "mundo exterior", factor: "factor" }[n.status] || n.status;
  }

  // ------------------------------------------------------------------ navigation API (also used by the oracle)
  function flyTo(n, dist) { cam.goal = { x: n.x, y: n.y, z: n.z, dist: dist || 260 }; cam.spin = false; }
  function focus(id, opts = {}) {
    const n = byId[id]; if (!n) return false;
    focusId = id; if (!opts.keepPath) path = [];
    flyTo(n);

    renderCard(); renderTrail();
    return true;
  }
  function core() { focusId = null; path = []; cam.goal = { x: 0, y: -20, z: 0, dist: 470 }; $("card").classList.remove("open"); renderTrail(); }
  function showPath(ids) {
    ids = ids.filter((i) => byId[i]); if (!ids.length) return;
    path = ids; pathT = 0; focusId = ids[ids.length - 1];
    const cx = ids.reduce((s, i) => s + byId[i].x, 0) / ids.length, cy = ids.reduce((s, i) => s + byId[i].y, 0) / ids.length, cz = ids.reduce((s, i) => s + byId[i].z, 0) / ids.length;
    const spread = Math.max(...ids.map((i) => Math.hypot(byId[i].x - cx, byId[i].y - cy, byId[i].z - cz)));
    cam.goal = { x: cx, y: cy, z: cz, dist: Math.max(260, spread * 3.2) }; cam.spin = false;
    ids.forEach((i) => { if (trail[trail.length - 1] !== i) trail.push(i); }); trail = trail.slice(-10);
    renderCard(); renderTrail();
  }
  function renderCard() {
    const card = $("card"), n = byId[focusId];
    if (!n) { card.classList.remove("open"); return; }
    const rel = (e, dir) => {
      const other = byId[dir === "out" ? e.to : e.from];
      return el("button", { type: "button", class: "rel" + (e.status === "planned" ? " planned" : ""), onclick: () => focus(other.id),
        title: `${dir === "out" ? "→" : "←"} ${other.label} · ${e.label} · peso ${(e.weight ?? 0.5).toFixed(2)}${e.status === "planned" ? " (por crear)" : ""}` },
        el("span", { "aria-hidden": "true" }, dir === "out" ? "→" : "←"),
        el("span", { class: "lab" }, other.label, " ", el("small", {}, "· " + e.label)),
        el("span", { class: "w" }, (e.weight ?? 0.5).toFixed(2)));
    };
    const ins = inn[n.id].slice().sort((a, b) => (b.weight ?? .5) - (a.weight ?? .5));
    const outs = out[n.id].slice().sort((a, b) => (b.weight ?? .5) - (a.weight ?? .5));
    card.replaceChildren(
      el("div", { class: "kind", style: `color:${colorOf(n)}` }, KIND_ES[n.kind] || n.kind),
      el("h2", {}, (n.kind === "call" ? `[${n.grade}] ` : "") + n.label),
      el("div", {}, el("span", { class: "pill" + (existsNode(n) && !n.pending ? "" : " no") }, statusText(n)),
        n.kind === "call" ? el("a", { class: "pill", href: "dashboard.html#call:" + encodeURIComponent(n.id.slice(2)), target: EMBED ? "_top" : "dashboard" }, "Ficha en el dashboard ↗") : null),
      n.detail ? el("p", { class: "detail" }, n.detail) : null,
      ins.length ? el("h3", {}, `Causas (${ins.length})`) : null, ...ins.map((e) => rel(e, "in")),
      outs.length ? el("h3", {}, `Efectos (${outs.length})`) : null, ...outs.map((e) => rel(e, "out")));
    card.classList.add("open");
  }
  function renderTrail() {
    const t = $("trail");

    t.replaceChildren(el("span", { style: "color:var(--muted)" }, "Ruta:"), ...trail.flatMap((id, i) => [i ? el("span", { "aria-hidden": "true", style: "color:var(--muted)" }, "›") : null,
      el("button", { type: "button", onclick: () => focus(id) }, byId[id] ? byId[id].label : id)]).filter(Boolean));
  }
  function banner(text) { const b = $("banner"); b.textContent = text || ""; b.classList.toggle("open", !!text); }

  // ------------------------------------------------------------------ chrome
  function legend() {
    const L = [["--line-cloudy", "Cloudy"], ["--line-semf", "SEMF"], ["--line-causality", "Causality"], ["--line-branchout", "BranchOut"], ["--line-delfina", "Fundación"]];
    $("legend").replaceChildren(...L.map(([v, t]) => el("span", {}, el("i", { style: `background:var(${v})` }), t)),
      el("span", {}, el("i", { class: "dia", style: "background:var(--world-sphere)" }), "esfera"),
      el("span", {}, el("i", { class: "sq", style: "background:var(--world-funder)" }), "financiador"),
      el("span", {}, el("i", { style: "background:var(--muted)" }), "hito"),
      el("span", {}, el("i", { class: "hol" }), "aún no existe"));

  $("find").addEventListener("change", (e) => { const q = e.target.value.toLowerCase(); const n = G.nodes.find((x) => x.label.toLowerCase() === q) || G.nodes.find((x) => x.label.toLowerCase().includes(q)); if (n) focus(n.id); e.target.value = ""; });

  if (location.hash.length > 1) {

  }

  // ------------------------------------------------------------------ oracle host adapter

  async function refresh() {

    page: "espacio",
    plan: () => DATA.plan,
    view: () => ({ tab: "espacio", focus: focusId ? { kind: "node", id: focusId } : null, path }),
    directView, refresh,

})();
